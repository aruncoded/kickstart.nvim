# Variable set to control Theme
setenv -g                               IS_DARK "true"

# Bind r key to reload conf
unbind    r
bind      r     source-file ~/.tmux.conf

# Bind Asterisk for Synchronizing panes
bind      *     setw synchronize-panes

# Re-bind Leader to Ctrl+Space
set -g prefix                           C-Space

# Allow Mouse for resizing
set -g mouse                            on

# Override starting Index to 1 (default 0)
set -g base-index                       1
set -g pane-base-index                  1

# Close the gap in window numbering when a window is killed
set -g renumber-windows                 on

#Change default scrollback of 2000 lines
set -g history-limit                    50000

# Add support for 256-color
set -g default-terminal                 "tmux-256color"
set -g terminal-overrides               ",*256col*:RGB,xterm-256color:RGB"

set-option -sg escape-time              10
set-option -g focus-events              on

# Enforce vim navigations
bind-key  h     select-pane -L
bind-key  j     select-pane -D
bind-key  k     select-pane -U
bind-key  l     select-pane -R

# Intuitive Split keys that open in the current DIR
unbind    %
bind      |     split-window -h -c      "#{pane_current_path}"
unbind    '"'
bind      -     split-window -v -c      "#{pane_current_path}"

# ================================================================================== #

# Custom TMUX Theme
# Structure:      palette -> status bar (left | windows | right)
#                 -> messages -> copy-mode and menus
# Toggling a piece: comment our its @sl_* / @sr_* line. Because 'prefix + r' only
#                   only re-runs source-file (which SETS options and never unsets a
#                   removed one), also run once:
#                   tmux set-option -gu @name
#                   ... or restart the server for the change to take effect live.


# Gruvbox inspired color palette
#   Referenced below as #={E:@c_name}, which is verified to expand inside both status
#   formats and style options.
set -g @c_dark                          "#1E1E2E"                               # text placed on top of pastel backgrounds
set -g @c_muted                         "#585B70"                               # dividers, inactive window names
set -g @c_lavender                      "#9CA3C4"                               # selection / menu highlight
set -g @c_sage                          "#A8C3A0"                               # MODE: Normal
set -g @c_purple                        "#C3A8D8"                               # MODE: Prefix
set -g @c_peach                         "#E0C097"                               # MODE: Copy
set -g @c_rose                          "#D8A8B0"                               # MODE: Sync, Copy-mode jump mark
set -g @c_gold                          "#D8C9A3"                               # Copy-mode search match
set -g @c_coral                         "#E0A8A0"                               # Copy-mode current search match


# Status bar: global
set -g status-style                     "bg=default"                            # transparent (inherit terminal background)

# Status bar: left
set -g @sl_session                      "#[fg=default, bg=default]  #S "
set -g @sl_divider                      "#[fg=#{@c_muted}]│#[fg=default, bg=default] "

set -g status-left-length               40
set -g status-left                      "#{E:@sl_session}#{E:@sl_divider}"

# Status bar: center (window list)
#   Active vs Inactive is conveyed by brightness alone, so the default * flag is 
#   dropped from the format; the last window "-" flag is kept but shown as italics
#   instead of a trailing character.
set -g window-status-format             "#{?window_last_flag,#[italics],}#I:#W#{?window_last_flag,#[noitalics],}"
set -g window-status-current-format     "#I:#W"
set -g window-status-style              "fg=#{@c_muted}, bg=default"
set -g window-status-current-style      "fg=default, bg=default, bold"
set -g window-status-separator          "  "

# Status bar: right
#   Listed in display order; each divider is its own variable so is neighbor can be
#   dropped without leaving an orphaned separator.
set -g @sr_zoom_offset                  "#{?window_bigger, [#{window_offset_x}#,#{window_offset_y}] ,}"
set -g @sr_context                      "#{=/25/...:#{b:pane_current_path}}:#{=21:pane_title} "
# set -g @sr_context                      "#{b:pane_current_path}:#{pane_current_command} " # Alt
set -g @sr_divider_1                    "#[fg=#{E:@c_muted}]│#[fg=default, bg=default] "
set -g @sr_datetime                     "%m/%d %H:%M "
set -g @sr_divider_2                    "#[fg=#{@c_muted}]│#[fg=default, bg=default] "
set -g @sr_mode                         "#{?client_prefix,#[fg=#{@c_dark} bg=#{@c_purple}] P ,#{?pane_in_mode,#[fg=#{@c_dark} bg=#{@c_peach}] C ,#{?pane_synchronized,#[fg=#{@c_dark} bg=#{@c_rose}] S ,#[fg=#{@c_dark} bg=#{@c_sage}] N }}}#[fg=default bg=default]"

set -g status-right-length              60
set -g status-right                     "#{E:@sr_zoom_offset}#{E:@sr_context}#{E:@sr_divider_1}#{E:@sr_datetime}#{E:@sr_divider_2}#{E:@sr_mode}"

# Messages (confirmation before y/n prompt)
set -g message-style                    "fg=default, bg=default"                # No more yellow box
set -g message-command-style            "fg=default, bg=default"

# Copy mode and menus
set -g mode-style                       "fg=#{@c_dark}, bg=#{@c_lavender}"      # selection, tree/choose picker row
set -g menu-selected-style              "fg=#{@c_dark}, bg=#{@c_lavender}"      # popup menu selected row
set -g copy-mode-mark-style             "fg=#{@c_dark}, bg=#{@c_rose}"          # jump mark
set -g copy-mode-match-style            "fg=#{@c_dark}, bg=#{@c_gold}"          # all search matches
set -g copy-mode-current-match-style    "fg=#{@c_dark}, bg=#{@c_coral}, bold"   # match, under cursor

